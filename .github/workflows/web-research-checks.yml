name: Web Research Feature Checks

on:
  push:
    branches:
      - feature/web-research-mode
  pull_request:
    branches:
      - main

jobs:
  backend-research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.162.0 pydantic==2.14.2 python-dotenv==1.2.4 httpx==0.28.1 google-genai==2.34.0 pytest==9.2.0
      - name: Test web research source filtering and grounding
        run: pytest backend/tests/test_web_research_service.py -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
